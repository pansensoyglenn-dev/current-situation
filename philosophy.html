<body>
  <div class="legal-page section-landing">
    <a class="back-link" href="index.html">← The Commonplace</a>
    <div class="section-cover-wrap" id="section-cover" style="display:none;"></div>
    <h1>Philosophy</h1>
    <p class="updated" style="font-family:'Source Serif 4', Georgia, serif; font-size:1.02rem; color:var(--text-secondary); text-transform:none; letter-spacing:0; margin-bottom:1.5rem;">Essays that sit with hard questions — ethics, meaning, and the different ways of thinking that shape a life.</p>

    </div>

  <script>
    // Looks for covers/philosophy.mp4 first, then covers/philosophy.jpg / .png / .webp.
    // Drop a matching file in the covers/ folder — no code changes needed.
    (function () {
      var container = document.getElementById('section-cover');
      var imageExts = ['jpg', 'jpeg', 'png', 'webp'];
      function tryImage(idx) {
        if (idx >= imageExts.length) { container.style.display = 'none'; return; }
        var img = document.createElement('img');
        img.className = 'section-cover';
        img.alt = 'Philosophy';
        img.loading = 'lazy';
        img.onload = function () { container.style.display = ''; };
        img.onerror = function () { tryImage(idx + 1); };
        img.src = 'covers/philosophy.' + imageExts[idx];
        container.innerHTML = '';
        container.appendChild(img);
      }
      var video = document.createElement('video');
      video.className = 'section-cover';
      video.autoplay = true;
      video.muted = true;
      video.loop = true;
      video.playsInline = true;
      video.setAttribute('aria-hidden', 'true');
      video.onloadeddata = function () { container.style.display = ''; };
      video.onerror = function () { tryImage(0); };
      video.src = 'covers/philosophy.mp4';
      container.appendChild(video);
    })();
  </script>
</body>
